[project]
name = "vuelos-baratos"
version = "0.1.0"
description = "Agente que vigila precios de vuelos (alertas de Google Flights por correo), guarda el histórico y avisa por Telegram de las bajadas"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "pyyaml>=6.0", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
