[project]
name = "flight-radar"
version = "0.1.0"
description = "Watches flight prices from Google Flights email alerts, keeps the history and sends Telegram notifications on price drops"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "pyyaml>=6.0", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
